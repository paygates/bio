    @keyframes fall {
      0% { transform: scale(0); }
      2% { transform: scale(1); top: -50px; }
      100% { transform: scale(0); top: 100%; }
    }
    .card {
      background: #2b2d31;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 28px 24px 32px;
      position: relative;
      z-index: 1;
      border: 1px solid transparent;
      transition: border-color .3s ease, box-shadow .3s ease, transform .25s ease, background .6s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
    .card:hover {
      border-color: #fff;
      box-shadow: 0 0 0 1px #fff, 0 0 24px rgba(255,255,255,.35), 0 12px 40px rgba(0,0,0,.6);
      transform: translateY(-2px);
    }
    .views {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .78rem;
      color: rgba(255,255,255,.55);
      background: rgba(0,0,0,.25);
      padding: 4px 9px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .views svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    .audio-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .audio-toggle:hover {
      background: rgba(0,0,0,.4);
      color: #fff;
    }
    .audio-toggle svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .audio-toggle.muted svg {
      opacity: .45;
    }
    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      cursor: pointer;
    }
    .avatar-wrap:hover .avatar {
      filter: brightness(.85);
    }
    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255,255,255,0);
      transition: box-shadow .2s ease;
      pointer-events: none;
    }
    .avatar-wrap:hover::after {
      box-shadow: 0 0 0 3px rgba(255,255,255,.25);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2b2d31;
      background: #1e1f22;
      display: block;
      transition: border-color .6s ease, filter .2s ease;
    }
    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 4px solid #2b2d31;
      background: #747f8d;
    }
    .status-dot.online { background: #23a559; }
    .status-dot.idle { background: #f0b232; }
    .status-dot.dnd { background: #f23f43; }
    .status-dot.offline { background: #747f8d; }
    .username {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 4px;
      min-height: 1.6em;
    }
    .handle {
      text-align: center;
      font-size: .9rem;
      color: #b5bac1;
      margin-bottom: 14px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      margin-bottom: 18px;
    }
    .badge {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      transition: transform .15s ease;
    }
    .badge:hover {
      transform: scale(1.15);
    }

    const BADGE_MAP = [
      { flag: 1 << 0, file: "staff.svg", name: "Discord Staff" },
      { flag: 1 << 1, file: "partnered_server_owner.svg", name: "Partnered Server Owner" },
      { flag: 1 << 2, file: "hypesquad_events.svg", name: "HypeSquad Events" },

      { flag: 1 << 18, file: "certified_moderator.svg", name: "Moderator Programs Alumni" },

    ];
    const BADGE_CDN =
      "https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges@latest/SVG/";

      r: 20,
      g: 20,

    };

    async function lookupDiscordUser(id) {
      try {
        const res = await fetch(
          `${DISCORD_LOOKUP_API}/${encodeURIComponent(id)}`
        );
        if (!res.ok) {
          throw new Error(`Lookup failed: ${res.status}`);
        }
        return await res.json();
      } catch (error) {
        console.error("Discord lookup failed:", error);
        return null;
      }
    }
    function getUser(data) {
      if (!data) return null;
      return data.user || data.discord_user || data;
    }
    function avatarUrl(user) {
      if (!user) return "";
      if (user.avatar) {
        const ext =
          user.avatar.startsWith("a_")
            ? "gif"
            : "png";
        return (
          `https://cdn.discordapp.com/avatars/` +
          `${user.id}/${user.avatar}.${ext}?size=256`
        );
      }
      const index =
        user.discriminator === "0"
          ? Number((BigInt(user.id) >> 22n) % 6n)
          : parseInt(user.discriminator || "0") % 5;
      return `https://cdn.discordapp.com/embed/avatars/${index}.png`;
    }
    function themeFromProfile(user) {
      if (!user) return null;
      if (user.banner_color) {
        const hex =
          user.banner_color.replace("#", "");
        if (hex.length === 6) {
          return {
            r: parseInt(hex.slice(0, 2), 16),
            g: parseInt(hex.slice(2, 4), 16),
            b: parseInt(hex.slice(4, 6), 16)
          };
        }
      }
      if (typeof user.accent_color === "number") {
        return {
          r: (user.accent_color >> 16) & 255,
          g: (user.accent_color >> 8) & 255,
          b: user.accent_color & 255
        };
      }
      return null;
    }
    function getDominantColor(img) {
      try {
        const canvas =
          document.createElement("canvas");
        const size = 40;
        canvas.width = size;
        canvas.height = size;
        const ctx =
          canvas.getContext("2d");
        ctx.drawImage(
          img,
          0,
          0,
          size,
          size
        );
        const data =
          ctx.getImageData(
            0,
            0,
            size,
            size
          ).data;
        let r = 0;
        let g = 0;
        let b = 0;
        let count = 0;
        for (
          let i = 0;
          i < data.length;
          i += 4
        ) {
          const brightness =
            (data[i] +
              data[i + 1] +
              data[i + 2]) / 3;
          if (
            brightness < 25 ||
            brightness > 230
          ) {
            continue;
          }
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }
        if (!count) {
          return {
            r: 20,
            g: 20,
            b: 24
          };
        }
        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);
        return {
          r: Math.round(r * .35),
          g: Math.round(g * .35),
          b: Math.round(b * .35)
        };
      } catch {
        return {
          r: 20,
          g: 20,
          b: 24
        };
      }
    }
    function applyTheme(color) {
      profileTheme = color;
      const { r, g, b } = color;
      const cardBg =
        `rgb(${Math.min(255, r + 28)},${Math.min(255, g + 28)},${Math.min(255, b + 28)})`;
      const darker =
        `rgb(${r},${g},${b})`;
      const bodyBg =
        `rgb(${Math.max(0, r - 12)},${Math.max(0, g - 12)},${Math.max(0, b - 12)})`;
      document.body.style.background =
        bodyBg;
      document.getElementById(
        "card"
      ).style.background =
        cardBg;
      document
        .querySelectorAll(
          ".avatar,.status-dot"
        )
        .forEach(el => {
          el.style.borderColor =
            cardBg;
        });
      document
        .querySelectorAll(
          ".bio-box,.link-icon"
        )
        .forEach(el => {
          el.style.background =
            darker;
        });
      applyFriendsTheme();
    }
    function applyFriendsTheme() {
      const { r, g, b } =
        profileTheme;
      const modalBg =
        `rgb(${Math.min(255, r + 28)},${Math.min(255, g + 28)},${Math.min(255, b + 28)})`;
      const itemBg =
        `rgb(${r},${g},${b})`;
      const itemHover =
        `rgb(${Math.min(255, r + 10)},${Math.min(255, g + 10)},${Math.min(255, b + 10)})`;
      const overlayBg =
        `rgba(${Math.max(0, r - 10)},${Math.max(0, g - 10)},${Math.max(0, b - 10)},.72)`;
      const modal =
        document.getElementById(
          "friends-modal"
        );
      const overlay =
        document.getElementById(
          "friends-overlay"
        );
      if (modal) {
        modal.style.background =
          modalBg;
      }
      if (overlay) {
        overlay.style.background =
          overlayBg;
      }
      document
        .querySelectorAll(".friend-item")
        .forEach(item => {
          item.style.background =
            itemBg;
          item.onmouseenter = () => {
            item.style.background =
              itemHover;
          };
          item.onmouseleave = () => {
            item.style.background =
              itemBg;
          };
        });
      const close =
        document.getElementById(
          "friends-close"
        );
      if (close) {
        close.style.background =
          itemBg;
      }
    }
    function getBadges(publicFlags) {
      return BADGE_MAP.filter(
        badge =>
          (publicFlags & badge.flag) ===
          badge.flag
      );
    }
    function typeText(
      element,
      text,
      speed
    ) {
      return new Promise(resolve => {
        element.textContent = "";
        element.classList.add(
          "typing"
        );
        let i = 0;
        function tick() {
          if (i <= text.length) {
            element.textContent =
              text.slice(0, i);
            i++;
            setTimeout(
              tick,
              speed
            );
          } else {
            element.classList.remove(
              "typing"
            );
            resolve();
          }
        }
        tick();
      });
    }
    async function loadViews() {
      try {
        const res =
          await fetch(
            "https://countapi.mileshilliard.com/api/v1/hit/" +
            COUNTER_KEY
          );

          await res.json();

          data.count ??

          Number(value)

        document.getElementById(
          "view-count"

    function initAudio() {
      const audio =
        document.getElementById(
          "bg-audio"

      const toggle =
        document.getElementById(
          "audio-toggle"

      function updateIcon() {
        toggle.classList.toggle(
          "muted",
          audio.paused
        );
      }
      audio
        .play()
        .then(updateIcon)
        .catch(() => {
          updateIcon();
          const startOnInteract =
            () => {
              audio
                .play()
                .then(updateIcon)
                .catch(() => {});
              window.removeEventListener(
                "click",
                startOnInteract
              );
              window.removeEventListener(
                "keydown",
                startOnInteract
              );
              window.removeEventListener(
                "touchstart",
                startOnInteract
              );
            };
          window.addEventListener(
            "click",
            startOnInteract
          );
          window.addEventListener(
            "keydown",
            startOnInteract
          );
          window.addEventListener(
            "touchstart",
            startOnInteract
          );
        });
      toggle.addEventListener(
        "click",
        event => {
          event.stopPropagation();
          if (audio.paused) {
            audio
              .play()
              .then(updateIcon)
              .catch(() => {});
          } else {
            audio.pause();
            updateIcon();
          }
        }
      );
    }
    function renderProfile(data) {
      const user =
        getUser(data);
      if (!user) {
        showError();
        return;
      }
      const avatar =
        document.getElementById(
          "avatar"
        );
      const profileColor =
        themeFromProfile(user);
      if (profileColor) {
        applyTheme(
          profileColor
        );
      }
      const profileAvatar =
        data.avatar_url ||
        avatarUrl(user);
      avatar.onload = () => {
        if (!profileColor) {
          applyTheme(
            getDominantColor(
              avatar
            )
          );
        }
      };
      avatar.src =
        profileAvatar;
      const displayName =
        user.global_name ||
        user.username ||
        "Unknown";

        "username"

        displayName;

        "handle"

        document.getElementById(

        hasIntroed = true;
        typeText(

          "bio"

          BIO_TEXT;

        "username"

        "Unavailable";

        "handle"

        "";

        "badges"

    async function fetchProfile() {

    function escapeHTML(value) {

    function renderFriendsList(
      entries
    ) {
      const list =
        document.getElementById(
          "friends-list"
        );
      list.innerHTML = "";
      entries.forEach(
        ({ id, data }) => {
          const user =
            getUser(data);
          const item =
            document.createElement(
              "div"
            );
          item.className =
            "friend-item";
          if (!user) {
            item.innerHTML = `
              <div class="friend-avatar-wrap">
                <div
                  class="friend-avatar"
                  style="display:flex;align-items:center;justify-content:center;color:#6d6f78;font-size:.7rem;"
                >
                  ?
                </div>
              </div>
              <div class="friend-info">
                <div class="friend-name">
                  Unavailable
                </div>
                <div class="friend-status-text">
                  ID ${escapeHTML(id)}
                </div>
              </div>
            `;
            list.appendChild(
              item
            );
            return;
          }
          const displayName =
            user.global_name ||
            user.username ||
            "Unknown";
          const username =
            user.username ||
            "unknown";
          const avatar =
            data.avatar_url ||
            avatarUrl(user);
          item.innerHTML = `
            <div class="friend-avatar-wrap">
              <img
                class="friend-avatar"
                src="${escapeHTML(avatar)}"
                alt="${escapeHTML(displayName)}"
              />
            </div>
            <div class="friend-info">
              <div class="friend-name">
                ${escapeHTML(displayName)}
              </div>
              <div class="friend-status-text">
                @${escapeHTML(username)}
              </div>
            </div>
          `;
          list.appendChild(
            item
          );
        }
      );
      applyFriendsTheme();
    }
    async function loadFriends() {
      if (friendsLoaded) {
        return;
      }
      friendsLoaded = true;
      const list =
        document.getElementById(
          "friends-list"
        );
      list.innerHTML = `
        <div
          style="color:#949ba4;font-size:.85rem;text-align:center;padding:12px 0;"
        >
          Loading…
        </div>
      `;
      const results =
        await Promise.all(
          FRIEND_IDS.map(
            async id => ({
              id,
              data:
                await lookupDiscordUser(
                  id
                )
            })
          )
        );
      renderFriendsList(
        results
      );
    }
    function openFriendsModal() {
      document
        .getElementById(
          "friends-overlay"
        )
        .classList.add(
          "open"
        );
      applyFriendsTheme();
      loadFriends();
    }
    function closeFriendsModal() {
      document
        .getElementById(
          "friends-overlay"
        )
        .classList.remove(
          "open"
        );
    }
    document
      .getElementById(
        "avatar-wrap"
      )
      .addEventListener(
        "click",
        event => {
          event.stopPropagation();
          openFriendsModal();
        }
      );
    document
      .getElementById(
        "friends-close"
      )
      .addEventListener(
        "click",
        closeFriendsModal
      );
    document
      .getElementById(
        "friends-overlay"
      )
      .addEventListener(
        "click",
        event => {
          if (
            event.target.id ===
            "friends-overlay"
          ) {
            closeFriendsModal();
          }
        }
      );
    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key ===
          "Escape"
        ) {
          closeFriendsModal();
        }
      }
    );
    loadViews();
    initAudio();
    fetchProfile();
  </script>
</body>
</html>
