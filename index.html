<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 24px;
      overflow: hidden;
      transition: background 0.8s ease;
    }

    #snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .flake {
      position: absolute;
      top: -20px;
      color: rgba(255, 255, 255, 0.7);
      user-select: none;
      animation: fall linear infinite;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      background: #2b2d31;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 28px 24px 32px;
      position: relative;
      z-index: 1;
      border: 1px solid transparent;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.25s ease, background 0.6s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .card:hover {
      border-color: #fff;
      box-shadow:
        0 0 0 1px #fff,
        0 0 24px rgba(255, 255, 255, 0.35),
        0 12px 40px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    .views {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 9px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .views svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      opacity: 0.9;
    }

    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2b2d31;
      background: #1e1f22;
      display: block;
      transition: border-color 0.6s ease;
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 4px solid #2b2d31;
      background: #747f8d;
      transition: border-color 0.6s ease;
    }

    .status-dot.online { background: #23a559; }
    .status-dot.idle   { background: #f0b232; }
    .status-dot.dnd    { background: #f23f43; }
    .status-dot.offline{ background: #747f8d; }

    .username {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .handle {
      text-align: center;
      font-size: 0.9rem;
      color: #b5bac1;
      margin-bottom: 14px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      margin-bottom: 18px;
    }

    .badge {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      transition: transform 0.15s ease;
    }

    .badge:hover {
      transform: scale(1.15);
    }

    .bio-box {
      background: #1e1f22;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #dbdee1;
      text-align: center;
      word-break: break-word;
      transition: background 0.6s ease;
    }

    .bio-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #949ba4;
      margin-bottom: 6px;
      text-align: left;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 22px;
    }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1e1f22;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #dbdee1;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .link-icon:hover {
      background: #fff;
      color: #000;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.25);
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 0.75rem;
      color: #6d6f78;
    }
  </style>
</head>
<body>
  <div id="snow"></div>

  <div class="card" id="card">
    <div class="views" id="views">
      <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      <span id="view-count">–</span>
    </div>

    <div class="avatar-wrap">
      <img class="avatar" id="avatar" src="" alt="Avatar" crossorigin="anonymous" />
      <div class="status-dot offline" id="status"></div>
    </div>

    <div class="username" id="username">Loading…</div>
    <div class="handle" id="handle">@…</div>

    <div class="badges" id="badges"></div>

    <div class="bio-label">Random Quote</div>
    <div class="bio-box" id="bio">
      I collect problems just to solve them later. Sometimes I forget the solving part.
    </div>

    <div class="links">
      <a class="link-icon" href="https://t.me/channel" target="_blank" rel="noopener" title="Telegram">
        <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      </a>
      <a class="link-icon" href="mailto:support@suka.rest" title="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <script>
    const DISCORD_ID = "707887497153216562";
    const BIO_TEXT = "I collect problems just to solve them later. Sometimes I forget the solving part.";
    const COUNTER_KEY = "suka-bio-" + DISCORD_ID;

    const BADGE_MAP = [
      { flag: 1 << 0,  file: "staff.svg", name: "Discord Staff" },
      { flag: 1 << 1,  file: "partnered_server_owner.svg", name: "Partnered Server Owner" },
      { flag: 1 << 2,  file: "hypesquad_events.svg", name: "HypeSquad Events" },
      { flag: 1 << 3,  file: "bug_hunter_level_1.svg", name: "Bug Hunter Level 1" },
      { flag: 1 << 6,  file: "hypesquad_bravery.svg", name: "HypeSquad Bravery" },
      { flag: 1 << 7,  file: "hypesquad_brilliance.svg", name: "HypeSquad Brilliance" },
      { flag: 1 << 8,  file: "hypesquad_balance.svg", name: "HypeSquad Balance" },
      { flag: 1 << 9,  file: "early_supporter.svg", name: "Early Supporter" },
      { flag: 1 << 14, file: "bug_hunter_level_2.svg", name: "Bug Hunter Level 2" },
      { flag: 1 << 17, file: "early_verified_developer.svg", name: "Early Verified Bot Developer" },
      { flag: 1 << 18, file: "certified_moderator.svg", name: "Moderator Programs Alumni" },
      { flag: 1 << 22, file: "active_developer.svg", name: "Active Developer" },
    ];

    const BADGE_CDN = "https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges@latest/SVG/";

    function getBadges(publicFlags) {
      return BADGE_MAP.filter(b => (publicFlags & b.flag) === b.flag);
    }

    function avatarUrl(user) {
      if (!user.avatar) {
        const idx = user.discriminator === "0"
          ? Number((BigInt(user.id) >> 22n) % 6n)
          : parseInt(user.discriminator) % 5;
        return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
      }
      const ext = user.avatar.startsWith("a_") ? "gif" : "png";
      return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
    }

    function getDominantColor(img) {
      try {
        const canvas = document.createElement("canvas");
        const size = 40;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;

        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
          const brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
          if (brightness < 25 || brightness > 230) continue;
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }

        if (count === 0) return { r: 20, g: 20, b: 24 };

        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);

        return {
          r: Math.round(r * 0.35),
          g: Math.round(g * 0.35),
          b: Math.round(b * 0.35)
        };
      } catch {
        return { r: 20, g: 20, b: 24 };
      }
    }

    function applyTheme(color) {
      const { r, g, b } = color;
      const cardBg = `rgb(${Math.min(255, r + 28)}, ${Math.min(255, g + 28)}, ${Math.min(255, b + 28)})`;
      const darker = `rgb(${r}, ${g}, ${b})`;
      const bodyBg = `rgb(${Math.max(0, r - 12)}, ${Math.max(0, g - 12)}, ${Math.max(0, b - 12)})`;

      document.body.style.background = bodyBg;
      document.getElementById("card").style.background = cardBg;

      document.querySelectorAll(".avatar, .status-dot").forEach(el => {
        el.style.borderColor = cardBg;
      });

      document.querySelectorAll(".bio-box, .link-icon").forEach(el => {
        el.style.background = darker;
      });
    }

    function createSnow() {
      const container = document.getElementById("snow");
      const count = 55;

      for (let i = 0; i < count; i++) {
        const flake = document.createElement("div");
        flake.className = "flake";
        flake.textContent = "❄";
        const size = 8 + Math.random() * 14;
        flake.style.fontSize = size + "px";
        flake.style.left = Math.random() * 100 + "vw";
        flake.style.animationDuration = 8 + Math.random() * 12 + "s";
        flake.style.animationDelay = Math.random() * 10 + "s";
        flake.style.opacity = 0.3 + Math.random() * 0.5;
        container.appendChild(flake);
      }
    }

    async function loadViews() {
      try {
        const res = await fetch(`https://api.countapi.xyz/hit/${COUNTER_KEY}/visits`);
        const data = await res.json();
        document.getElementById("view-count").textContent = data.value.toLocaleString();
      } catch {
        document.getElementById("view-count").textContent = "–";
      }
    }

    function render(data) {
      const user = data.discord_user;
      const status = data.discord_status || "offline";
      const url = avatarUrl(user);

      const avatar = document.getElementById("avatar");
      avatar.onload = () => applyTheme(getDominantColor(avatar));
      avatar.src = url;

      document.getElementById("username").textContent = user.global_name || user.username;
      document.getElementById("handle").textContent = `@${user.username}`;

      const statusEl = document.getElementById("status");
      statusEl.className = "status-dot " + status;

      const badgesEl = document.getElementById("badges");
      badgesEl.innerHTML = "";
      getBadges(user.public_flags || 0).forEach(b => {
        const img = document.createElement("img");
        img.src = BADGE_CDN + b.file;
        img.alt = b.name;
        img.title = b.name;
        img.className = "badge";
        badgesEl.appendChild(img);
      });

      document.getElementById("bio").textContent = BIO_TEXT;
      document.getElementById("footer").textContent = "";
    }

    function showError() {
      document.getElementById("username").textContent = "Unavailable";
      document.getElementById("handle").textContent = "";
      document.getElementById("badges").innerHTML = "";
      document.getElementById("footer").textContent = "";
    }

    async function fetchPresence() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const json = await res.json();
        if (!json.success) {
          showError();
          return;
        }
        render(json.data);
      } catch {
        showError();
      }
    }

    createSnow();
    loadViews();
    fetchPresence();
    setInterval(fetchPresence, 30000);
  </script>
</body>
</html>
