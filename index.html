    body {

      background: #000;

      align-items: center;
      justify-content: center;

    #snow {

      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .b {
      position: absolute;
      top: -50px;
      border-radius: 50%;
      background: rgba(255,255,255,.8);
      box-shadow: 0 0 15px 10px rgba(255,255,255,.35);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: scale(0);
        top: -50px;
      }
      2% {
        transform: scale(1);
        top: -50px;
      }
      100% {
        transform: scale(0);
        top: 100%;
      }
    }

    .card {
      background: #2b2d31;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 28px 24px 32px;
      position: relative;
      z-index: 1;
      border: 1px solid transparent;
      transition: border-color .3s ease, box-shadow .3s ease, transform .25s ease, background .6s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }

    .card:hover {
      border-color: #fff;
      box-shadow:
        0 0 0 1px #fff,
        0 0 24px rgba(255,255,255,.35),
        0 12px 40px rgba(0,0,0,.6);
      transform: translateY(-2px);
    }

    .views {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .78rem;
      color: rgba(255,255,255,.55);
      background: rgba(0,0,0,.25);
      padding: 4px 9px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .views svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .audio-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background .2s ease, color .2s ease;
    }

    .audio-toggle:hover {
      background: rgba(0,0,0,.4);
      color: #fff;
    }

    .audio-toggle svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .audio-toggle.muted svg {
      opacity: .45;
    }

    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      cursor: pointer;
    }

    .avatar-wrap:hover .avatar {
      filter: brightness(.85);
    }

    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255,255,255,0);
      transition: box-shadow .2s ease;
      pointer-events: none;
    }

    .avatar-wrap:hover::after {
      box-shadow: 0 0 0 3px rgba(255,255,255,.25);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2b2d31;
      background: #1e1f22;
      display: block;
      transition: border-color .6s ease, filter .2s ease;
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 4px solid #2b2d31;
      background: #747f8d;

    .status-dot.idle {

    }

    .status-dot.dnd {

    .status-dot.offline {

    .username {

    .handle {

    .badges {

    .footer {

      font-size: .75rem;
      color: #6d6f78;

    .friends-overlay {
      position: fixed;

    .friends-list {

    .friend-item {

    .friend-avatar-wrap {

    .friend-avatar {

    .friend-info {

    .friend-name {

    .friend-badges {

    .friend-badge {

    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        max-width: 380px;
      }

  </style>
</head>

      { flag: 1 << 0, file: "staff.svg", name: "Discord Staff" },

      { flag: 1 << 14, file: "bug_hunter_level_2.svg", name: "Bug Hunter Level 2" },
      { flag: 1 << 17, file: "early_verified_developer.svg", name: "Early Verified Bot Developer" },
      { flag: 1 << 18, file: "certified_moderator.svg", name: "Moderator Programs Alumni" },
      { flag: 1 << 22, file: "active_developer.svg", name: "Active Developer" }
    ];

    const BADGE_CDN = "https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges@latest/SVG/";

    let currentTheme = {
      card: "#2b2d31",
      darker: "#1e1f22",
      body: "#000",

    };

    let hasIntroed = false;
    let friendsLoaded = false;

    let themeLocked = false;

    function createSnow() {
      const snow = document.getElementById("snow");

      for (let i = 0; i < 80; i++) {
        const dot = document.createElement("div");
        dot.className = "b";

        const size = Math.floor(Math.random() * 10) + 2;
        const left = (i / 80) * 100;
        const duration = Math.floor(Math.random() * 20) + 11;
        const delay = Math.floor(Math.random() * 12);

        dot.style.left = `${left}%`;
        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.animationDuration = `${duration}s`;
        dot.style.animationDelay = `${delay}s`;

        snow.appendChild(dot);
      }
    }

    function getBadges(publicFlags) {
      return BADGE_MAP.filter(b => (publicFlags & b.flag) === b.flag);
    }

    function avatarUrl(user) {
      if (user.avatar_url) {
        return user.avatar_url;
      }

      if (!user.avatar) {
        const discriminator = user.discriminator || "0";

        const idx = discriminator === "0"
          ? Number((BigInt(user.id) >> 22n) % 6n)
          : parseInt(discriminator) % 5;

        return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
      }

      const ext = user.avatar.startsWith("a_") ? "gif" : "png";

      return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
    }

    function themeFromProfile(user) {
      if (user.banner_color) {
        const hex = user.banner_color.replace("#", "");

        if (hex.length === 6) {
          return {
            r: parseInt(hex.slice(0, 2), 16),
            g: parseInt(hex.slice(2, 4), 16),
            b: parseInt(hex.slice(4, 6), 16)
          };
        }
      }

      if (typeof user.accent_color === "number") {
        return {
          r: (user.accent_color >> 16) & 255,
          g: (user.accent_color >> 8) & 255,
          b: user.accent_color & 255
        };
      }

      return null;
    }

    function getDominantColor(img) {
      try {
        const canvas = document.createElement("canvas");
        const size = 40;

        canvas.width = size;
        canvas.height = size;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img, 0, 0, size, size);

        const data = ctx.getImageData(0, 0, size, size).data;

        let r = 0;
        let g = 0;
        let b = 0;
        let count = 0;

        for (let i = 0; i < data.length; i += 4) {
          const brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;

          if (brightness < 25 || brightness > 230) continue;

          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }

        if (!count) {
          return null;
        }

        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);

        return {
          r: Math.round(r * .35),
          g: Math.round(g * .35),
          b: Math.round(b * .35)
        };
      } catch {
        return null;
      }
    }

    function rgb(color) {
      return `rgb(${color.r}, ${color.g}, ${color.b})`;
    }

    function applyTheme(color) {
      const { r, g, b } = color;

      const cardBg = `rgb(
        ${Math.min(255, r + 28)},
        ${Math.min(255, g + 28)},
        ${Math.min(255, b + 28)}
      )`;

      const darker = `rgb(${r}, ${g}, ${b})`;

      const bodyBg = `rgb(
        ${Math.max(0, r - 12)},
        ${Math.max(0, g - 12)},
        ${Math.max(0, b - 12)}
      )`;

      currentTheme = {
        card: cardBg,
        darker,
        body: bodyBg,
        accent: `rgb(${Math.min(255, r + 100)}, ${Math.min(255, g + 100)}, ${Math.min(255, b + 100)})`
      };

      document.body.style.background = bodyBg;

      document.getElementById("card").style.background = cardBg;

      document.querySelectorAll(".avatar, .status-dot").forEach(el => {
        el.style.borderColor = cardBg;
      });

      document.querySelectorAll(".bio-box, .link-icon").forEach(el => {
        el.style.background = darker;
      });

      document.getElementById("friends-modal").style.background = cardBg;

      document.querySelectorAll(".friend-item").forEach(el => {
        el.style.background = darker;
      });

      document.querySelectorAll(".friends-close").forEach(el => {
        el.style.background = darker;
      });

      document.querySelectorAll(".friend-avatar").forEach(el => {
        el.style.background = cardBg;
      });

      themeLocked = true;
    }

    function typeText(el, text, speed) {
      return new Promise(resolve => {
        el.textContent = "";
        el.classList.add("typing");

        let i = 0;

        function tick() {
          if (i <= text.length) {
            el.textContent = text.slice(0, i);
            i++;
            setTimeout(tick, speed);
          } else {
            el.classList.remove("typing");
            resolve();
          }
        }

        tick();
      });
    }

    async function loadViews() {
      try {
        const res = await fetch(
          "https://countapi.mileshilliard.com/api/v1/hit/" + COUNTER_KEY
        );

        const data = await res.json();

        const value = data.value ?? data.count ?? 0;

        document.getElementById("view-count").textContent =
          Number(value).toLocaleString();
      } catch {
        document.getElementById("view-count").textContent = "–";
      }
    }

    function initAudio() {
      const audio = document.getElementById("bg-audio");
      const toggle = document.getElementById("audio-toggle");

      function updateIcon() {
        toggle.classList.toggle("muted", audio.paused);
      }

      audio.play()
        .then(updateIcon)
        .catch(() => {
          updateIcon();

          const startOnInteract = () => {
            audio.play()
              .then(updateIcon)
              .catch(() => {});

            window.removeEventListener("click", startOnInteract);
            window.removeEventListener("keydown", startOnInteract);
            window.removeEventListener("touchstart", startOnInteract);
          };

          window.addEventListener("click", startOnInteract);
          window.addEventListener("keydown", startOnInteract);
          window.addEventListener("touchstart", startOnInteract);
        });

      toggle.addEventListener("click", e => {
        e.stopPropagation();

        if (audio.paused) {
          audio.play()
            .then(updateIcon)
            .catch(() => {});
        } else {
          audio.pause();
          updateIcon();
        }
      });
    }

    function render(data) {
      const user = data.discord_user;
      const status = data.discord_status || "offline";
      const url = avatarUrl(user);
      const avatar = document.getElementById("avatar");

      if (!themeLocked) {
        const profileTheme = themeFromProfile(user);

        if (profileTheme) {
          applyTheme(profileTheme);
        } else {
          avatar.onload = () => {
            if (themeLocked) return;

            const dominant = getDominantColor(avatar);

            applyTheme(dominant || { r: 20, g: 20, b: 24 });
          };

          avatar.onerror = () => {
            if (themeLocked) return;
            applyTheme({ r: 20, g: 20, b: 24 });
          };
        }
      }

      avatar.src = url;

      const displayName = user.global_name || user.username;

      document.getElementById("handle").textContent =
        `@${user.username}`;

      const statusEl = document.getElementById("status");

      statusEl.className = "status-dot " + status;

      const badgesEl = document.getElementById("badges");

      badgesEl.innerHTML = "";

      getBadges(user.public_flags || 0).forEach(b => {
        const img = document.createElement("img");

        img.src = BADGE_CDN + b.file;
        img.alt = b.name;
        img.title = b.name;
        img.className = "badge";

        badgesEl.appendChild(img);
      });

      document.getElementById("username").textContent = displayName;

      if (!hasIntroed) {
        hasIntroed = true;

        const bioEl = document.getElementById("bio");

        typeText(bioEl, BIO_TEXT, 20);

        document.title = `${displayName} • Bio`;
      } else {
        document.getElementById("bio").textContent = BIO_TEXT;
      }

      document.getElementById("footer").textContent = "";
    }

    function showError() {
      document.getElementById("username").textContent = "Unavailable";
      document.getElementById("handle").textContent = "";
      document.getElementById("badges").innerHTML = "";
      document.getElementById("footer").textContent = "";
    }

    async function fetchPresence() {
      try {
        const res = await fetch(
          `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
        );

        const json = await res.json();

        if (!json.success) {
          showError();
          return;
        }

        render(json.data);
      } catch {
        showError();
      }
    }

    async function fetchFriendProfile(id) {
      try {
        const res = await fetch(
          FRIEND_PROFILE_API + encodeURIComponent(id)
        );

        if (!res.ok) {
          return {
            id,
            data: null
          };
        }

        const json = await res.json();

        return {
          id,
          data: json.user || json
        };
      } catch {
        return {
          id,
          data: null
        };
      }
    }

    function renderFriendBadges(user) {
      const flags = user.public_flags || user.flags || 0;

      return getBadges(flags)
        .slice(0, 4)
        .map(b => `
          <img
            class="friend-badge"
            src="${BADGE_CDN + b.file}"
            alt="${b.name}"
            title="${b.name}"
          >
        `)
        .join("");
    }

    function renderFriendsList(entries) {
      const listEl = document.getElementById("friends-list");

      listEl.innerHTML = "";

      entries.forEach(({ id, data }) => {
        const item = document.createElement("div");

        item.className = "friend-item";
        item.style.background = currentTheme.darker;

        if (!data) {
          item.innerHTML = `
            <div class="friend-avatar-wrap">
              <div
                class="friend-avatar"
                style="display:flex;align-items:center;justify-content:center;color:#6d6f78;font-size:.7rem;"
              >?</div>
            </div>
            <div class="friend-info">
              <div class="friend-name">Unavailable</div>
              <div class="friend-username">${id}</div>
            </div>
          `;

          listEl.appendChild(item);
          return;
        }

        const displayName =
          data.global_name ||
          data.username ||
          "Unknown";

        const username =
          data.username ||
          displayName;

        const url = avatarUrl(data);

        const profileTheme = themeFromProfile(data);

        item.innerHTML = `
          <div class="friend-avatar-wrap">
            <img
              class="friend-avatar"
              src="${url}"
              alt="${displayName}"
            >
          </div>

          <div class="friend-info">
            <div class="friend-name">${escapeHtml(displayName)}</div>
            <div class="friend-username">@${escapeHtml(username)}</div>
          </div>

          <div class="friend-badges">
            ${renderFriendBadges(data)}
          </div>
        `;

        const friendAvatar = item.querySelector(".friend-avatar");

        friendAvatar.style.background = currentTheme.card;

        if (profileTheme) {
          const { r, g, b } = profileTheme;

          friendAvatar.style.boxShadow =
            `0 0 0 2px rgba(${r}, ${g}, ${b}, .35)`;
        }

        listEl.appendChild(item);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadFriends() {
      if (friendsLoaded) return;

      friendsLoaded = true;

      const results = await Promise.all(
        FRIEND_IDS.map(fetchFriendProfile)
      );

      renderFriendsList(results);
    }

    function openFriendsModal() {
      const overlay = document.getElementById("friends-overlay");

      overlay.classList.add("open");

      document.getElementById("friends-modal").style.background =
        currentTheme.card;

      loadFriends();
    }

    function closeFriendsModal() {
      document
        .getElementById("friends-overlay")
        .classList.remove("open");
    }

    document
      .getElementById("avatar-wrap")
      .addEventListener("click", e => {
        e.stopPropagation();
        openFriendsModal();
      });

    document
      .getElementById("friends-close")
      .addEventListener("click", closeFriendsModal);

    document
      .getElementById("friends-overlay")
      .addEventListener("click", e => {
        if (e.target.id === "friends-overlay") {
          closeFriendsModal();
        }
      });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeFriendsModal();
      }
    });

    createSnow();
    loadViews();
    initAudio();
    fetchPresence();

    setInterval(fetchPresence, 30000);
  </script>
</body>
</html>
