<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020202">
  <meta name="description" content="Suka World — a little corner of the internet.">
  <title>SUKA WORLD</title>
  <style>
    :root { color-scheme: dark; --base:#020202; --text:#b8b8b8; --line:#242424; --accent:#96333e; }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height:100%; background:var(--base); }
    body { margin:0; min-height:100%; background:var(--base); color:var(--text); font-family:Georgia,"Times New Roman",serif; overflow-x:hidden; }
    button,input { font:inherit; }
    a { -webkit-tap-highlight-color:transparent; }
    .stars { position:fixed; inset:0; z-index:0; pointer-events:none; background-image:radial-gradient(1px 1px at 17% 13%,#999 99%,transparent),radial-gradient(1px 1px at 48% 7%,#aaa 99%,transparent),radial-gradient(1px 1px at 69% 37%,#777 99%,transparent),radial-gradient(1px 1px at 92% 66%,#777 99%,transparent),radial-gradient(1px 1px at 33% 75%,#777 99%,transparent);background-size:280px 210px;opacity:.38;animation:drift 35s linear infinite; }
    @keyframes drift { to { transform:translateY(-210px); } }

    .boot-screen { position:fixed; inset:0; z-index:1000; background:#000; display:grid; place-items:center; opacity:1; visibility:visible; transition:opacity .65s ease,visibility .65s ease; }
    .boot-screen.finished { opacity:0; visibility:hidden; pointer-events:none; }
    .boot-inner { width:min(230px,75vw); margin-top:-2vh; font-family:"Courier New",monospace; }
    .boot-title { text-align:center; color:#a6a6a6; font-family:Georgia,"Times New Roman",serif; font-size:clamp(11px,1vw,15px); letter-spacing:.36em; font-weight:700; white-space:nowrap; margin:0 0 17px; }
    .boot-output { color:#777; font-size:clamp(7px,.7vw,10px); line-height:1.8; min-height:100px; white-space:pre-wrap; }
    .boot-line { opacity:0; animation:boot-reveal .12s ease forwards; }
    @keyframes boot-reveal { to { opacity:1; } }
    .boot-skip { display:block; margin:17px auto 0; padding:5px 10px; color:#555; background:transparent; border:1px solid #191919; font:9px monospace; letter-spacing:.08em; cursor:pointer; }
    .boot-skip:hover,.boot-skip:focus-visible { color:#bbb; border-color:#555; }
    body.booting .stage, body.booting .stars, body.booting .music { visibility:hidden; }

    .stage { width:100%; height:100vh; height:100dvh; min-height:0; position:relative; isolation:isolate; overflow:hidden; }
    .site-header { position:absolute; top:clamp(18px,3.3vh,35px); left:0; width:100%; text-align:center; z-index:5; pointer-events:none; }
    .brand { color:#c5c5c5; font-size:clamp(9px,.77vw,13px); font-weight:700; letter-spacing:clamp(3px,.4vw,7px); text-transform:uppercase; text-decoration:none; pointer-events:auto; white-space:nowrap; }
    .theme { position:absolute; right:clamp(12px,2vw,34px); top:0; padding:6px 11px; background:transparent; border:1px solid #292929; color:#7f7f7f; font:clamp(8px,.65vw,11px) monospace; letter-spacing:.08em; cursor:pointer; pointer-events:auto; }
    .theme:hover { border-color:#777; color:#ddd; }

    .friends { position:absolute; z-index:6; left:clamp(12px,2vw,40px); top:clamp(65px,10vh,120px); display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2.6vh,26px); max-height:80vh; overflow:auto; scrollbar-width:thin; scrollbar-color:#333 transparent; padding:8px 12px 8px 8px; }
    .friend { display:flex; align-items:center; flex-direction:column; gap:5px; text-decoration:none; color:#acacac; font-size:clamp(9px,.75vw,12px); letter-spacing:.04em; width:clamp(118px,10.5vw,150px); text-align:center; padding:12px 6px 10px; background:#050505b8; border:1px solid #181818; transition:color .2s,border-color .2s,box-shadow .2s; }
    .friend[aria-disabled="true"] { cursor:default; }
    .friend:hover { color:#f5f5f5; border-color:#3a3a3a; box-shadow:0 0 22px #ffffff08; }
    .status-dot { position:absolute; right:2%; bottom:2%; width:12px; height:12px; border-radius:50%; background:#747f8d; border:2px solid #050505; display:none; z-index:2; }
    .status-dot.online { background:#3ba55d; display:block; } .status-dot.idle { background:#faa61a; display:block; } .status-dot.dnd { background:#ed4245; display:block; } .status-dot.offline { background:#747f8d; display:block; }
    .friend:hover .friend-avatar { filter:grayscale(0); transform:translateY(-2px); border-color:#757575; }
    .avatar-wrap { position:relative; flex:none; width:clamp(53px,4.7vw,74px); height:clamp(53px,4.7vw,74px); margin-bottom:4px; }
    .friend-avatar { display:grid; place-items:center; width:100%; height:100%; border:1px solid #343434; border-radius:50%; overflow:hidden; background:radial-gradient(circle at 35% 25%,#595959,#191919 52%,#080808); box-shadow:0 0 14px #ffffff0a; filter:grayscale(.40); transition:filter .2s,transform .2s,border-color .2s; }
    .friend-avatar img { display:block; width:100%; height:100%; object-fit:cover; }
    .friend-avatar .placeholder { color:#d2d2d2; font:700 clamp(17px,2vw,29px) Georgia,serif; text-transform:uppercase; }
    .avatar-deco { position:absolute; inset:-10%; width:120%; height:120%; max-width:none; pointer-events:none; }
    .friend-name { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#d0d0d0; font-weight:700; }
    .friend-user { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#8a8a8a; font-size:.9em; }
    .friend-id { display:block; max-width:100%; font:clamp(7px,.58vw,9px) "Courier New",monospace; color:#6c6c6c; letter-spacing:.02em; white-space:nowrap; }
    .friend-id::before { content:"✦ "; color:var(--accent); }
    .friend-id::after { content:" ✦"; color:var(--accent); }
    .friend:hover .friend-id { color:#a8a8a8; }
    .friend:focus-visible, .theme:focus-visible, .music button:focus-visible, .music label:focus-visible { outline:1px solid #ddd; outline-offset:3px; }

    .terminal { position:absolute; z-index:3; top:clamp(125px,29vh,440px); left:30.5%; width:clamp(310px,32vw,610px); max-height:61vh; overflow:auto; background:#050505ef; border:1px solid #242424; box-shadow:0 0 0 1px #0b0b0b,0 12px 60px #0008; color:#919191; font:clamp(9px,.72vw,12px)/1.46 "Courier New",monospace; }
    .terminal-bar { min-height:clamp(21px,2.3vh,30px); background:#151515; border-bottom:1px solid #242424; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 9px; font-size:clamp(8px,.65vw,11px); color:#606060; }
    .dots { display:flex; gap:4px; }
    .dots i { display:block; width:5px; height:5px; border-radius:50%; background:#555; }
    .terminal-content { padding:clamp(8px,1vw,16px); white-space:pre-wrap; overflow-wrap:anywhere; }
    .terminal-content p { margin:0; }
    .terminal-content .red { color:var(--accent); }
    .terminal-content .bright { color:#bbb; }
    .terminal-content .faint { color:#666; }
    .cursor { animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }

    .character { position:absolute; right:clamp(-22px,1.2vw,35px); bottom:0; z-index:2; width:clamp(310px,41vw,800px); height:auto; max-height:80dvh; object-fit:contain; object-position:right bottom; pointer-events:none; user-select:none; filter:brightness(.96); }
    .status { position:absolute; bottom:clamp(18px,4vh,40px); left:clamp(20px,4.3vw,90px); z-index:3; font:clamp(7px,.55vw,11px) "Courier New",monospace; color:#3c3c3c; letter-spacing:.14em; }

    .music { position:fixed; right:clamp(10px,1.7vw,30px); bottom:clamp(10px,2.5vh,32px); z-index:10; width:clamp(155px,16vw,250px); padding:10px; background:#080808ed; border:1px solid #292929; backdrop-filter:blur(8px); font:clamp(9px,.7vw,12px) "Courier New",monospace; box-shadow:0 8px 32px #000a; }
    .track { display:flex; gap:8px; align-items:center; border-bottom:1px solid #292929; padding-bottom:7px; }
    .cover { width:28px; height:28px; background:linear-gradient(135deg,#777,#313131 45%,#000); flex:none; }
    .track-meta { min-width:0; flex:1; }
    .track-name { color:#c9c9c9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sub { color:#777; font-size:.8em; margin-top:3px; }
    .controls { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:5px; }
    .controls button,.controls label { background:transparent; border:0; padding:3px; color:#b9b9b9; cursor:pointer; font:14px monospace; }
    .controls button:hover,.controls label:hover { color:white; }
    .clock { font:10px monospace; color:#929292; }
    .seek { display:block; width:100%; height:3px; accent-color:#a5a5a5; margin:7px 0 0; cursor:pointer; }
    .playlist { max-height:120px; overflow:auto; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid #292929; scrollbar-width:thin; scrollbar-color:#333 transparent; }
    .playlist button { display:block; width:100%; text-align:left; background:transparent; border:0; color:#888; font:inherit; padding:3px 2px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .playlist button:hover { color:#ddd; }
    .playlist button.active { color:#fff; text-shadow:0 0 8px #ffffff80; }
    .playlist button.active::before { content:"▸ "; }
    .vol { display:flex; align-items:center; gap:6px; margin-top:6px; }
    .vol button { background:transparent; border:0; padding:0 2px; cursor:pointer; font-size:12px; line-height:1; }
    .vol input { flex:1; min-width:0; height:3px; accent-color:#a5a5a5; cursor:pointer; margin:0; }
    .soft { --base:#0a0810; --accent:#b77898; }
    .soft .terminal { border-color:#523647; }
    .soft .brand { color:#e0bccc; }

    @media (max-width:1000px) and (min-width:681px) {
      .terminal { left:27%; width:40%; }
      .character { right:-3%; width:45vw; height:auto; max-height:72vh; }
      .friends { left:10px; }
    }
    @media (max-width:680px) {
      .stage { height:auto; min-height:max(800px,100dvh); overflow:hidden; padding-bottom:400px; }
      .site-header { top:20px; }
      .brand { font-size:10px; letter-spacing:2px; }
      .theme { top:44px; right:12px; font-size:8px; }
      .friends { top:83px; left:7px; right:7px; display:flex; flex-direction:row; align-items:flex-start; justify-content:flex-start; gap:12px; max-height:none; overflow-x:auto; padding:8px 8px 9px; }
      .friend { width:112px; min-width:112px; font-size:9px; }
      .avatar-wrap { width:46px; height:46px; }
      .friend-id { font-size:7px; }
      .terminal { left:5%; top:250px; width:90%; min-width:0; max-height:320px; font-size:10px; }
      .character { bottom:85px; right:-25px; width:min(90vw,490px); height:auto; max-height:48vh; }
      .status { left:14px; bottom:18px; font-size:7px; }
      .music { right:10px; bottom:10px; width:180px; }
    }
    @media (max-width:380px) {
      .terminal { top:240px; font-size:9px; }
    }
    @media (max-height:560px) and (min-width:681px) {
      .terminal { top:27%; max-height:62%; }
      .friends { top:16%; gap:9px; }
      .avatar-wrap { width:42px; height:42px; }
      .character { width:min(42vw,590px); height:auto; max-height:75%; }
    }
    @media (min-width:1800px) {
      .terminal { left:31%; top:29%; }
      .character { width:min(40vw,870px); }
    }
    @media (max-width:900px) and (min-width:681px) {
      .terminal { min-width:0; width:42vw; left:25%; }
      .character { width:46vw; }
    }
    @media (prefers-reduced-motion:reduce) { .stars,.cursor { animation:none; } .friend-avatar { transition:none; } }
  
    :root { --glow:#ffffff; }
    .soft { --glow:#f6d3e3; }
    .prompt-row { display:flex; align-items:baseline; cursor:text; }
    .prompt-row input { flex:1; min-width:0; background:transparent; border:0; outline:0; padding:0; color:#d6d6d6; font:inherit; caret-color:var(--glow); text-shadow:0 0 6px color-mix(in srgb,var(--glow) 45%,transparent); }
    .terminal { cursor:text; transition:box-shadow .25s,border-color .25s; box-shadow:0 0 0 1px #0b0b0b,0 0 22px color-mix(in srgb,var(--glow) 14%,transparent),0 0 60px color-mix(in srgb,var(--glow) 6%,transparent),0 12px 60px #0008; }
    .terminal:focus-within { border-color:#7a7a7a; box-shadow:0 0 0 1px #0b0b0b,0 0 34px color-mix(in srgb,var(--glow) 28%,transparent),0 0 90px color-mix(in srgb,var(--glow) 10%,transparent),0 12px 60px #0008; }
    .terminal-content .bright, .terminal-content .red { text-shadow:0 0 8px color-mix(in srgb,currentColor 55%,transparent); }
    .friend { border-color:#2b2b2b; box-shadow:0 0 16px color-mix(in srgb,var(--glow) 11%,transparent),inset 0 0 14px color-mix(in srgb,var(--glow) 4%,transparent); }
    .friend:hover { border-color:#c4c4c4; box-shadow:0 0 28px color-mix(in srgb,var(--glow) 32%,transparent),0 0 60px color-mix(in srgb,var(--glow) 12%,transparent),inset 0 0 18px color-mix(in srgb,var(--glow) 9%,transparent); }
    .friend-avatar { box-shadow:0 0 18px color-mix(in srgb,var(--glow) 22%,transparent); }
    .friend-name { text-shadow:0 0 8px color-mix(in srgb,var(--glow) 40%,transparent); }
    .music { border-color:#333; box-shadow:0 0 20px color-mix(in srgb,var(--glow) 13%,transparent),0 8px 32px #000a; }
    .brand { text-shadow:0 0 10px color-mix(in srgb,var(--glow) 45%,transparent); }
    .theme:hover { box-shadow:0 0 14px color-mix(in srgb,var(--glow) 25%,transparent); }

    .terminal { resize:both; max-height:90vh; min-width:260px; min-height:140px; }
    .terminal-bar { cursor:grab; user-select:none; position:sticky; top:0; z-index:1; }
    .terminal-bar:active { cursor:grabbing; }
    .win-x { background:transparent; border:0; color:#777; cursor:pointer; font:14px monospace; padding:0 4px; }
    .win-x:hover { color:#fff; }
    .hdr-left { position:absolute; left:clamp(12px,2vw,34px); top:0; display:flex; gap:6px; pointer-events:auto; }
    .theme.hdr { position:static; }
    .a-b { color:#e0e0e0; font-weight:700; } .a-r { color:#d4606c; } .a-g { color:#74c48c; } .a-y { color:#d9b865; } .a-bl { color:#7aa2f7; } .a-c { color:#6cc4d4; } .a-f { color:#666; }
    .browser { position:absolute; z-index:20; left:22%; top:14%; width:clamp(320px,52vw,900px); height:62vh; min-width:280px; min-height:200px; display:flex; flex-direction:column; background:#050505f2; border:1px solid #2e2e2e; resize:both; overflow:hidden; box-shadow:0 0 28px color-mix(in srgb,var(--glow) 16%,transparent),0 12px 60px #000a; }
    .browser[hidden] { display:none; }
    .browser-nav { display:flex; gap:4px; padding:5px; background:#0c0c0c; border-bottom:1px solid #242424; }
    .browser-nav button { background:transparent; border:1px solid #2a2a2a; color:#aaa; cursor:pointer; padding:2px 8px; font:13px monospace; }
    .browser-nav button:hover { color:#fff; border-color:#777; }
    .browser-nav input { flex:1; min-width:0; background:#050505; border:1px solid #2a2a2a; color:#ccc; padding:3px 8px; font:12px "Courier New",monospace; outline:0; }
    .browser-nav input:focus { border-color:#7a7a7a; }
    .browser iframe { flex:1; width:100%; border:0; background:#fff; min-height:0; }
    .browser-status { font:9px monospace; color:#555; padding:2px 8px; background:#0c0c0c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    @media (max-width:680px) { .browser { left:3%; top:100px; width:94%; height:60vh; } .hdr-left { top:44px; left:12px; } }
  </style>
</head>
<body class="booting">
  <div class="boot-screen" id="bootScreen" aria-label="Loading Suka World" role="status">
    <div class="boot-inner">
      <h1 class="boot-title">SUKA WORLD</h1>
      <div class="boot-output" id="bootOutput" aria-live="off"></div>
      <button class="boot-skip" id="bootSkip" type="button">SKIP INTRO</button>
    </div>
  </div>
  <div class="stars" aria-hidden="true"></div>
  <div class="stage">
    <header class="site-header">
      <a class="brand" href="#home">✦ SUKA WORLD</a>
      <div class="hdr-left"><button class="theme hdr" id="openTerm" type="button">TERMINAL</button><button class="theme hdr" id="openBrowser" type="button">BROWSER</button></div>
      <button class="theme" id="theme" type="button">CHANGE MOOD</button>
    </header>
    <nav class="friends" id="friends" aria-label="Friends on Discord"></nav>
    <main>
      <section class="terminal" id="termWin" aria-label="Terminal window">
        <div class="terminal-bar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>suka.rest — 80x24</span>
          <button class="win-x" id="termClose" type="button" aria-label="Hide terminal">×</button>
        </div>
        <div class="terminal-content" id="terminalText"></div>
      </section>
      <img class="character" src="SUKA.gif" alt="Animated anime character" draggable="false">
    </main>
    <section class="window browser" id="browserWin" aria-label="Browser" hidden>
      <div class="terminal-bar" id="browserBar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>suka browser</span><button class="win-x" id="browserClose" type="button" aria-label="Close browser">×</button></div>
      <div class="browser-nav">
        <button type="button" id="bBack" aria-label="Back">←</button><button type="button" id="bFwd" aria-label="Forward">→</button><button type="button" id="bReload" aria-label="Reload">↻</button>
        <input id="bUrl" type="text" placeholder="type a url or search" autocomplete="off" spellcheck="false" aria-label="Address">
        <button type="button" id="bOut" aria-label="Open in a new tab" title="Open the real site in a new tab">↗</button>
      </div>
      <iframe id="bFrame" title="Browser view" sandbox="allow-scripts allow-forms allow-popups" srcdoc="<body style='background:#050505;color:#777;font:13px monospace;padding:22px'>type a url above, or run <b>browse example.com</b> in the terminal.</body>"></iframe>
      <div class="browser-status" id="bStat"></div>
    </section>
    <div class="status">SUKA WORLD · SYSTEM ONLINE</div>
  </div>
  <section class="music" aria-label="Music player">
    <div class="playlist" id="playlist" hidden></div>
    <div class="track">
      <div class="cover" aria-hidden="true"></div>
      <div class="track-meta"><div class="track-name" id="track">suka.mp3</div><div class="sub" id="trackStatus">PRESS PLAY</div></div>
    </div>
    <div class="controls">
      <label for="file" title="Add your own audio to the playlist" tabindex="0" role="button" aria-label="Add audio file">＋</label>
      <input id="file" type="file" accept="audio/*" hidden>
      <button type="button" id="list" title="Show playlist" aria-label="Toggle playlist">☰</button>
      <button type="button" id="prev" title="Previous (or restart)" aria-label="Previous track">⏮</button>
      <button type="button" id="play" title="Play or pause" aria-label="Play or pause">▶</button>
      <button type="button" id="next" title="Next track" aria-label="Next track">⏭</button>
      <span class="clock" id="clock">0:00</span>
    </div>
    <input class="seek" id="seek" type="range" min="0" max="100" value="0" aria-label="Seek through audio">
    <div class="vol"><button type="button" id="mute" aria-label="Mute">🔊</button><input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume"></div>
    <audio id="audio" preload="auto"></audio>
  </section>
  <script src="friends.js"></script>
  <script src="playlist.js"></script>
  <script>
    'use strict';
    (() => {
      const screen=document.getElementById('bootScreen');
      const output=document.getElementById('bootOutput');
      const skip=document.getElementById('bootSkip');
      const lines=[
        '• initializing kernel...   [OK]',
        '• mounting filesystem...  [OK]',
        '• loading audio modules... [OK]',
        '• establishing secure channel...',
        '  [OK]',
        '• welcome.'
      ];
      const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let timers=[];
      let done=false;
      const finish=()=>{
        if(done)return;
        done=true;
        timers.forEach(clearTimeout);
        document.body.classList.remove('booting');
        if(window.startMusic) window.startMusic();
        screen.classList.add('finished');
        screen.setAttribute('aria-hidden','true');
        window.setTimeout(()=>screen.remove(),reducedMotion?0:750);
      };
      skip.addEventListener('click',finish);
      lines.forEach((line,i)=>{
        timers.push(setTimeout(()=>{
          const row=document.createElement('div');
          row.className='boot-line';
          row.textContent=line;
          output.append(row);
        },reducedMotion?i*35:350+i*350));
      });
      timers.push(setTimeout(finish,reducedMotion?500:2900));
    })();

    const terminal=document.getElementById('terminalText');
    const box=document.getElementById('termWin');
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const stripAnsi=s=>String(s).replace(/\x1b\[[0-9;]*m/g,'');
    const ANSI_CLS={'1':'a-b','31':'a-r','32':'a-g','33':'a-y','34':'a-bl','36':'a-c','90':'a-f'};
    function ansi(s) {
      let out='',open=0;
      for(const p of String(s).split(/(\x1b\[[0-9;]*m)/)) {
        const m=p.match(/^\x1b\[([0-9;]*)m$/);
        if(!m) { out+=esc(p); continue; }
        for(;open>0;open--) out+='</span>';
        const c=ANSI_CLS[m[1]]; if(c) { out+=`<span class="${c}">`; open++; }
      }
      for(;open>0;open--) out+='</span>';
      return out;
    }
    class Err extends Error { constructor(m,code=1){ super(m); this.code=code; } }

    const playlist=(Array.isArray(window.SUKA_PLAYLIST)&&window.SUKA_PLAYLIST.length?window.SUKA_PLAYLIST:[{title:'suka',src:'suka.mp3'}])
      .map(t=>({title:String(t.title||t.src),src:String(t.src)}));
    let cur=0, errors=0, userPaused=false;

    function renderList() {
      listEl.replaceChildren();
      playlist.forEach((t,i)=>{
        const b=document.createElement('button'); b.type='button'; b.textContent=t.title;
        if(i===cur) b.className='active';
        b.addEventListener('click',()=>load(i,true));
        listEl.append(b);
      });
    }
    function load(i,autoplay) {
      cur=(i+playlist.length)%playlist.length;
      const t=playlist[cur];
      audio.src=t.src; trackName.textContent=t.title; trackStatus.textContent='LOADING'; userPaused=false;
      renderList();
      if(autoplay) audio.play().catch(()=>{trackStatus.textContent='PRESS PLAY';});
    }
    const next=()=>load(cur+1,true);
    const prev=()=>{ if(audio.currentTime>3) audio.currentTime=0; else load(cur-1,true); };

    let userMuted=false, volume=0.7;
    try { const v=localStorage.getItem('suka:vol'); if(v!==null&&!isNaN(+v)) volume=Math.min(1,Math.max(0,+v)); } catch(_) {}
    const vol=document.getElementById('vol'), muteBtn=document.getElementById('mute');
    const applyVol=()=>{ audio.volume=volume; vol.value=Math.round(volume*100); muteBtn.textContent=(userMuted||volume===0)?'🔇':'🔊'; };
    vol.addEventListener('input',()=>{ volume=vol.value/100; if(volume>0) userMuted=false; audio.muted=userMuted; applyVol(); try { localStorage.setItem('suka:vol',String(volume)); } catch(_) {} });
    muteBtn.addEventListener('click',()=>{ userMuted=!userMuted; audio.muted=userMuted; applyVol(); });
    applyVol();

    const EVTS=['pointerdown','keydown','touchend','click'];
    window.startMusic=()=>{ if(userPaused||audio.error) return; audio.muted=userMuted; audio.play().catch(()=>{}); };
    const firstInteraction=()=>window.startMusic();
    EVTS.forEach(e=>window.addEventListener(e,firstInteraction,{passive:true}));
    const settle=()=>{ if(!audio.paused&&!audio.muted) EVTS.forEach(e=>window.removeEventListener(e,firstInteraction)); };
    audio.addEventListener('playing',settle); audio.addEventListener('volumechange',settle);

    load(0,false);
    audio.muted=true; audio.play().catch(()=>{});

    audio.addEventListener('ended',next);
    audio.addEventListener('error',()=>{
      trackStatus.textContent=playlist[cur].src.startsWith('blob:')?'ERROR':playlist[cur].src+' NOT FOUND';
      if(playlist.length>1 && ++errors<playlist.length) setTimeout(next,1500);
    });
    audio.addEventListener('playing',()=>{ errors=0; });
    file.addEventListener('change',()=>{
      const selected=file.files?.[0]; if(!selected)return;
      playlist.push({title:selected.name,src:URL.createObjectURL(selected)});
      load(playlist.length-1,true); file.value='';
    });
    play.addEventListener('click',()=>{ if(audio.paused) { userPaused=false; audio.play().catch(()=>{}); } else { userPaused=true; audio.pause(); } });
    document.getElementById('next').addEventListener('click',next);
    document.getElementById('prev').addEventListener('click',prev);
    document.getElementById('list').addEventListener('click',()=>{ listEl.hidden=!listEl.hidden; });
    const showState=()=>{ play.textContent=audio.paused?'▶':'Ⅱ'; trackStatus.textContent=audio.paused?(userPaused?'PAUSED':'TAP ANYWHERE TO PLAY'):(audio.muted&&!userMuted?'STARTING…':'PLAYING'); };
    audio.addEventListener('play',showState); audio.addEventListener('pause',()=>{ if(!audio.ended) showState(); }); audio.addEventListener('volumechange',showState);
    audio.addEventListener('timeupdate',()=>{
      seek.value=audio.duration?audio.currentTime/audio.duration*100:0;
      document.getElementById('clock').textContent=Math.floor(audio.currentTime/60)+':'+String(Math.floor(audio.currentTime%60)).padStart(2,'0');
    });
    seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=audio.duration*Number(seek.value)/100;});
    document.querySelector('label[for="file"]').addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();file.click();}
    });
  </script>
